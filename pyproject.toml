[project]
name = "swarm-alignment-2026"
version = "0.1.0"
description = "Apart Swarm Alignment Sprint (Nov 6-8 2026): witness-free tamper forensics for multi-agent logs"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.50"]
data = ["datasets>=3.0", "pandas>=2.2"]
plot = ["matplotlib>=3.9"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
