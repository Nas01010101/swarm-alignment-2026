[project]
name = "swarm-alignment-2026"
version = "0.1.0"
description = "Nobody Builds the Wall: LLM agent island economies, public goods and coordination (Apart Swarm Alignment Sprint 2026)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.50"]
data = ["datasets>=3.0", "pandas>=2.2"]
plot = ["matplotlib>=3.9"]
sim = [
    "gdm-concordia>=2.1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
